name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid uv zsign zip unzip
          uv tool install "cyan @ git+https://github.com/asdfzxcvbn/pyzule-rw"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL "${{ github.event.inputs.ipa_url }}" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - name: Compile Taurus Tweak
        run: |
          make package

      - name: Inject Tweak into IPA
        run: |
          mkdir -p out
          DEB_FILE=$(ls packages/*.deb 2>/dev/null | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            cyan -i ipa/spotify.ipa -f "$DEB_FILE" -o out/Taurus_temp.ipa
          else
            echo "::error::No compiled .deb package found!"
            exit 1
          fi

      - name: Strip Watch App and PlugIns
        run: |
          mkdir -p extracted
          unzip -q out/Taurus_temp.ipa -d extracted/
          
          # Remove Watch companion app and extra extensions to prevent bundle ID mismatch
          rm -rf extracted/Payload/*.app/Watch
          rm -rf extracted/Payload/*.app/PlugIns
          
          # Repackage cleaned IPA
          cd extracted
          zip -qr ../out/Taurus.ipa Payload/
          cd ..
          rm -rf extracted out/Taurus_temp.ipa

      - uses: actions/upload-artifact@v5
        if: github.event.inputs.upload_method != 'filebin'
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: github.event.inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
